name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests and APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Publish APK to build branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/VideoCompressor.apk
          mkdir -p out/unit-tests
          cp -r app/build/test-results/testDebugUnitTest/. out/unit-tests/ || true
          .github/scripts/publish.sh build out

      - name: Publish log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p logs
          tail -n 400 build.log > logs/build-tail.log || true
          cp build.log logs/build-full.log || true
          mkdir -p logs/reports
          cp -r app/build/test-results/testDebugUnitTest/. logs/reports/ || true
          .github/scripts/publish.sh ci-logs-build logs
